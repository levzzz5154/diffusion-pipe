# Example config for training a distillation LoRA on the Anima model.
#
# Workflow:
#   1. In ComfyUI, use the SaveDistillationData node to save 100 samples
#      generated by the teacher model (80 NFE, CFG 4).
#   2. Point the dataset config at the directory of saved .safetensors files.
#   3. Train the distillation LoRA with this config.
#   4. At inference, use the distilled LoRA with fewer steps and CFG 1.

output_dir = '/home/levzzz/Documents/software/diffusion-pipe/outputs'
dataset = 'examples/anima_distill_dataset.toml'

epochs = 100
micro_batch_size_per_gpu = 1
gradient_accumulation_steps = 1
gradient_clipping = 1.0
warmup_steps = 127
pipeline_stages = 1
activation_checkpointing = true

save_every_n_epochs = 5
checkpoint_every_n_epochs = 5

[model]
type = 'anima'
transformer_path = '/home/levzzz/ComfyUI/models/diffusion_models/anima-preview.safetensors'
vae_path = '/home/levzzz/ComfyUI/models/vae/qwen_image_vae.safetensors'
llm_path = '/home/levzzz/ComfyUI/models/text_encoders/qwen_3_06b_base.safetensors'
dtype = 'bfloat16'
# Freeze the LLM adapter — the LoRA on the DiT is sufficient for distillation.
llm_adapter_lr = 0
# Uniform timestep sampling can work well for distillation.
timestep_sample_method = 'uniform'

[adapter]
type = 'lora'
rank = 32
dropout = 0.0
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 2e-5
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8
